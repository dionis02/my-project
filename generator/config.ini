[DEFAULT]
; scaffold or periphery
mode = scaffold
; protein in .pdb format
protein_name = flt3_4rt7_ref_protein_final.pdb
; grid in .pdb format
grid_name = grid_resolved.pdb
; probe in .sdf format
probe_name = probe.sdf
; final mcf mode (none, simplified, basic (recommended) or strict)
final_mcf_mode = strict
; max number of atoms of all types
limits_dict = Car:12,Cs2:1,C3r:0,Cs3:0,Csp:0,Nd+:0,Nd0:2,Nac:2,.=O:1,O_a:0,O_d:0,SO2:0,Sul:0,Hal:0
; max number of elements
elem_dict = N:6,O:1,S:1
; NO atoms sum limit
no_limit = 15
; int
max_num_low_cycles = 1
; int
important_amino_acid_number = 694
; atom name from .pdb file
important_atom_name = N
; acceptor or donor of h-bond
ligand_role = acceptor
; float
gridbox_center_x = -28.1
gridbox_center_y = -5.3
gridbox_center_z = -28.5
; CatBoost or MedChem
phar_model = MedChem
; bool
allow_axial_groups = False
; bool
allow_chair_only = True
; bool
allow_cs3_in_arom_rings = False
; bool
allow_condensed_alicyclics = False
; bool
allow_paired_Nd0 = False
; int
max_num_chiral_centers = 0
; 'all' or int != 0
max_poses_of_one_structure = 2
; atoms to build to, leave empty square brackets if all allowed
allowed_atoms_idxs = []
; int
max_clashes = 8
; int
max_acyclic_chain_length = 8
; int
num_heavy_atoms_to_add = 15
; int
number_of_poses_on_iter = 10
; sigmoid or xepo
scoring_method = expo
; fragment library in .sdf format
frag_lib = 4-atomic library_added_frags.sdf
; float
local_difference_value = 0.5
; bool
Nac_outside_arom_ring = False
; bool
skip_minimization = True
; bool
allow_positive_charges = True
; bool
allow_negative_charges = True
; int
max_num_charged_atoms = 3
; int
max_execution_time = 48
; int
allow_Nd0_Nac_pair = False
; int
allow_double_bonded_arom_rings = False
; int
worst_nbg_score = -5
; bool
allow_linker_Sul = False
; bool
allow_alkenes = False
; bool
check_crucial_interaction = True
; int
min_mol_size = 5
; str
ref_lib_to_pass =
; int
max_num_positive_charges = 1
; int
max_num_negative_charges = 1
; str
time_management_mode = dynamic_snapshot
; int
branch_time_factor = 1.0
; int
min_branch_seconds = 300
; int
max_branch_seconds = 7200
; int
; До какой итерации включительно динамически делить время между sibling-ветками.
; После этой итерации глубокая DFS-ветка наследует дедлайн родителя, old-like.
dynamic_split_until_iter = 5
